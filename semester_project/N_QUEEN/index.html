<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N-Queen Application</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>N-Queen Application</h1>
      <p class="intro">Enter the value of N and click solve to place N queens safely.</p>

      <div class="controls">
        <label for="sizeInput">Board Size:</label>
        <input id="sizeInput" type="number" min="4" max="12" value="8" />
        <button id="solveBtn" type="button">Solve</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>

      <p id="message" class="message">Ready</p>

      <div id="board" class="board" aria-label="N-Queen board"></div>

      <div class="solution-controls">
        <button id="prevBtn" type="button">Previous</button>
        <span id="solutionInfo">Solution: -</span>
        <button id="nextBtn" type="button">Next</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
